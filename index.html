<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263746">
<title>Mini Writter</title>
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=3">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
<style>
:root{--bg:#eef1f4;--bar:#263746;--bar2:#34495e;--paper:#fff;--text:#1f2937;--muted:#6b7280;--border:#d7dde3;--accent:#2563eb;--danger:#b42318;--page-w:210mm;--page-min-h:297mm;--page-pad-y:25.4mm;--page-pad-x:25.4mm}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(238,241,244,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:8px 10px}.top-inner{max-width:1080px;margin:auto}.docbar{display:flex;align-items:center;gap:8px;margin-bottom:7px}.title{flex:1;min-width:0;border:1px solid var(--border);background:#fff;border-radius:7px;padding:8px 10px;font-weight:700}.doc-actions{display:flex;gap:6px;flex-wrap:wrap}.btn,.tool,select{border:0;border-radius:6px;background:#eef2f6;color:#18212b;min-height:34px;padding:0 9px;font-size:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.toolbar{background:var(--bar);border-radius:9px;padding:7px;display:grid;grid-template-columns:auto minmax(290px,1fr) auto auto auto;gap:6px;align-items:stretch;overflow-x:auto}.group{display:flex;align-items:center;gap:4px;padding:0 6px 0 0;border-right:1px solid #667585;flex:0 0 auto;min-height:36px}.group:last-child{border-right:0;padding-right:0}.tool{min-width:36px;padding:0 9px;white-space:nowrap}.toolbar select{height:34px}.toolbar #blockFormat{width:92px}.toolbar #fontName{width:145px}.toolbar #fontSize{width:64px}.color-label{position:relative;width:36px;height:36px;background:#eef2f6;border-radius:6px;display:grid;place-items:center;cursor:pointer}.color-label input{position:absolute;inset:0;opacity:0}.swatch{width:17px;height:17px;border-radius:50%;border:1px solid #111}.more-wrap{display:none;background:var(--bar2);border-radius:0 0 9px 9px;padding:7px;margin-top:-2px;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.more-wrap.open{display:grid}.more-wrap .group{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:7px;padding:6px;flex-wrap:wrap;align-content:flex-start}.group-label{width:100%;font-size:10px;color:#dbe7f3;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}.page-tools select{flex:1;min-width:105px}.paper-wrap{max-width:1080px;margin:12px auto;padding:0 10px 30px}.statusbar{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:11px;margin:0 2px 7px}.status-left,.status-right{display:flex;gap:10px;flex-wrap:wrap}.page-stage{overflow:auto;padding:2px 0 20px}.editor{width:min(100%,var(--page-w));min-height:var(--page-min-h);margin:0 auto;background:var(--paper);padding:var(--page-pad-y) var(--page-pad-x);box-shadow:0 3px 18px rgba(15,23,42,.13);outline:none;border-radius:3px;font-family:Arial,sans-serif;font-size:16px;line-height:1.5;overflow-wrap:anywhere;transition:width .15s,min-height .15s,padding .15s}.editor:empty:before{content:attr(data-placeholder);color:#9ca3af}.editor img{max-width:100%;height:auto}.editor table{border-collapse:collapse;max-width:100%}.editor td,.editor th{border:1px solid #9ca3af;padding:6px 8px}.editor blockquote{border-left:4px solid #94a3b8;margin-left:0;padding-left:14px;color:#475569}.page-break{border-top:2px dashed #94a3b8;margin:28px 0;height:0;position:relative}.page-break:after{content:'Page Break';position:absolute;right:0;top:4px;font-size:10px;color:#94a3b8}.toast{position:fixed;right:14px;bottom:14px;background:#111827;color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:700px){.top{padding:7px}.docbar{align-items:stretch}.title{font-size:14px}.doc-actions{flex-wrap:nowrap}.doc-actions .hide-mobile{display:none}.doc-actions .btn{padding:0 8px}.toolbar{display:flex;gap:4px;padding:6px}.toolbar .group{padding-right:5px;min-height:40px}.toolbar .group:nth-child(2){display:none}.toolbar .tool{min-width:40px}.more-wrap{grid-template-columns:1fr 1fr;max-height:48vh;overflow:auto}.paper-wrap{margin-top:8px;padding:0 7px 20px}.page-stage{overflow-x:auto}.editor{width:100%!important;min-height:calc(100vh - 210px)!important;padding:22px 18px!important;font-size:16px}.tool,.btn,select{min-height:40px}.color-label{width:40px;height:40px}}@media(max-width:430px){.docbar{gap:5px}.title{min-width:90px}.doc-actions{gap:4px}.doc-actions .btn{font-size:11px;padding:0 7px}.doc-actions #printBtn{display:none}.toolbar .group:nth-child(5){display:none}.more-wrap{grid-template-columns:1fr}}
@media print{body{background:#fff}.top,.statusbar,.toast{display:none!important}.paper-wrap,.page-stage{max-width:none;margin:0;padding:0;overflow:visible}.editor{width:auto!important;min-height:0!important;box-shadow:none;border:0;border-radius:0;margin:0;padding:0!important}.page-break{border:0;break-after:page;height:0;margin:0}.page-break:after{display:none}}
</style>
<style id="printPageStyle">@page{size:A4 portrait;margin:25.4mm}</style>
</head>
<body>
<div class="app"><header class="top"><div class="top-inner">
<div class="docbar"><input id="docTitle" class="title" value="Untitled" aria-label="Document title"><div class="doc-actions"><button class="btn" id="newBtn">New</button><button class="btn hide-mobile" id="openBtn">Open</button><button class="btn primary" id="saveBtn">Save</button><button class="btn" id="printBtn">Print/PDF</button><button class="btn" id="moreBtn">More</button></div></div>
<div class="toolbar"><div class="group"><button class="tool" data-cmd="undo">↶</button><button class="tool" data-cmd="redo">↷</button></div><div class="group"><select id="blockFormat"><option value="p">Normal</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option><option value="blockquote">Quote</option></select><select id="fontName"><option>Arial</option><option>Segoe UI</option><option>Calibri</option><option>Georgia</option><option>Times New Roman</option><option>Courier New</option><option>Verdana</option><option>Tahoma</option><option>Microsoft YaHei</option><option>Microsoft JhengHei</option><option>SimSun</option><option>KaiTi</option></select><select id="fontSize"><option>10</option><option>11</option><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option><option>64</option></select></div><div class="group"><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="underline"><u>U</u></button><button class="tool" data-cmd="strikeThrough"><s>S</s></button></div><div class="group"><button class="tool" data-cmd="insertUnorderedList">• List</button><button class="tool" data-cmd="insertOrderedList">1. List</button></div><div class="group"><button class="tool" data-cmd="justifyLeft">L</button><button class="tool" data-cmd="justifyCenter">C</button><button class="tool" data-cmd="justifyRight">R</button><button class="tool" data-cmd="justifyFull">J</button></div></div>
<div class="more-wrap" id="moreTools">
<div class="group page-tools"><div class="group-label">Page</div><select id="paperSize"><option value="A4">A4</option><option value="Letter">Letter</option><option value="Legal">Legal</option></select><select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select><select id="marginPreset"><option value="normal">Normal margins</option><option value="narrow">Narrow margins</option><option value="wide">Wide margins</option></select></div>
<div class="group"><div class="group-label">Color</div><label class="color-label" title="Text color"><input id="textColor" type="color" value="#000000"><span class="swatch" id="textSwatch" style="background:#000"></span></label><label class="color-label" title="Highlight"><input id="highlightColor" type="color" value="#ffff00"><span class="swatch" id="highlightSwatch" style="background:#ffff00"></span></label></div>
<div class="group"><div class="group-label">Format</div><button class="tool" data-cmd="indent">Indent</button><button class="tool" data-cmd="outdent">Outdent</button><button class="tool" data-cmd="subscript">x₁</button><button class="tool" data-cmd="superscript">x²</button><button class="tool" id="clearFormatBtn">Clear Style</button></div>
<div class="group"><div class="group-label">Text</div><select id="lineSpacing"><option value="1">1.0×</option><option value="1.15">1.15×</option><option value="1.5" selected>1.5×</option><option value="2">2.0×</option></select><button class="tool" id="upperBtn">ABC</button><button class="tool" id="lowerBtn">abc</button><button class="tool" id="capitalizeBtn">Aa</button></div>
<div class="group"><div class="group-label">Insert</div><button class="tool" id="linkBtn">Link</button><button class="tool" data-cmd="unlink">Unlink</button><button class="tool" id="imageBtn">Image</button><button class="tool" id="tableBtn">Table</button><button class="tool" id="checkBtn">☐ Check</button></div>
<div class="group"><div class="group-label">Document</div><button class="tool" data-cmd="insertHorizontalRule">HR</button><button class="tool" id="pageBreakBtn">Page Break</button><button class="tool" id="dateBtn">Date/Time</button><button class="tool" id="findBtn">Find</button><button class="tool" id="replaceBtn">Replace</button></div>
</div></div></header>
<main class="paper-wrap"><div class="statusbar"><div class="status-left"><span id="saveState">Saved locally</span><span id="pageInfo">A4 · Portrait · Normal</span></div><div class="status-right"><span id="wordCount">0 words</span><span id="charCount">0 chars</span></div></div><div class="page-stage"><div id="editor" class="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing..."></div></div></main></div>
<input id="filePicker" type="file" accept=".html,.htm,.txt,text/html,text/plain" hidden><input id="imagePicker" type="file" accept="image/*" hidden><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),editor=$('editor');const KEY='mini_writter_doc_v3';let saveTimer=null;
const pageSizes={A4:{p:[210,297],l:[297,210]},Letter:{p:[215.9,279.4],l:[279.4,215.9]},Legal:{p:[215.9,355.6],l:[355.6,215.9]}};const margins={normal:25.4,narrow:12.7,wide:38.1};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1400)}
function fileName(ext){const base=($('docTitle').value.trim()||'document').replace(/[\\/:*?"<>|]+/g,'_').slice(0,80);return `${base}.${ext}`}
function stats(){const text=(editor.innerText||'').trim(),words=text?text.split(/\s+/).filter(Boolean).length:0;$('wordCount').textContent=`${words} words`;$('charCount').textContent=`${(editor.innerText||'').length} chars`}
function pageSettings(){return{size:$('paperSize').value,orientation:$('orientation').value,margin:$('marginPreset').value}}
function applyPage(){const p=pageSettings(),dims=pageSizes[p.size][p.orientation==='landscape'?'l':'p'],m=margins[p.margin];document.documentElement.style.setProperty('--page-w',dims[0]+'mm');document.documentElement.style.setProperty('--page-min-h',dims[1]+'mm');document.documentElement.style.setProperty('--page-pad-x',m+'mm');document.documentElement.style.setProperty('--page-pad-y',m+'mm');$('printPageStyle').textContent=`@page{size:${p.size} ${p.orientation};margin:${m}mm}`;$('pageInfo').textContent=`${p.size} · ${p.orientation[0].toUpperCase()+p.orientation.slice(1)} · ${p.margin[0].toUpperCase()+p.margin.slice(1)}`;scheduleSave()}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({v:3,title:$('docTitle').value,html:editor.innerHTML,page:pageSettings(),updated:Date.now()}));$('saveState').textContent='Saved locally'}catch{$('saveState').textContent='Local save unavailable'}}
function scheduleSave(){$('saveState').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,350);stats()}
function loadLocal(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d){d=JSON.parse(localStorage.getItem('mini_writter_doc_v2')||'null')}if(d?.html!=null){editor.innerHTML=d.html;$('docTitle').value=d.title||'Untitled';const p=d.page||{};$('paperSize').value=p.size||'A4';$('orientation').value=p.orientation||'portrait';$('marginPreset').value=p.margin||'normal';return}const old=sessionStorage.getItem('rich_content');if(old)editor.innerHTML=old}catch{}}
function focusExec(cmd,val=null){editor.focus();document.execCommand(cmd,false,val);scheduleSave()}function fontPx(px){editor.focus();document.execCommand('fontSize',false,'7');editor.querySelectorAll('font[size="7"]').forEach(n=>{n.removeAttribute('size');n.style.fontSize=px+'px'});scheduleSave()}function selectionBlock(){const s=getSelection();if(!s.rangeCount)return editor;let n=s.anchorNode;while(n&&n!==editor&&!(n.nodeType===1&&/^(P|DIV|H1|H2|H3|BLOCKQUOTE|LI)$/.test(n.tagName)))n=n.parentNode;return n&&n!==editor?n:editor}function setLineHeight(v){let b=selectionBlock();if(b===editor){document.execCommand('formatBlock',false,'p');b=selectionBlock()}if(b&&b!==editor)b.style.lineHeight=v;scheduleSave()}function transformSelection(fn){const s=getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),t=r.toString();r.deleteContents();r.insertNode(document.createTextNode(fn(t)));scheduleSave()}function insertHtml(h){editor.focus();document.execCommand('insertHTML',false,h);scheduleSave()}
function sanitizeHtml(html){const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,iframe,object,embed,link,meta').forEach(n=>n.remove());d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||((n==='href'||n==='src')&&v.startsWith('javascript:')))el.removeAttribute(a.name)}));return d.body.innerHTML}
function download(text,type,name){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>focusExec(b.dataset.cmd));$('blockFormat').onchange=e=>focusExec('formatBlock',e.target.value);$('fontName').onchange=e=>focusExec('fontName',e.target.value);$('fontSize').onchange=e=>fontPx(+e.target.value);$('textColor').oninput=e=>{$('textSwatch').style.background=e.target.value;focusExec('foreColor',e.target.value)};$('highlightColor').oninput=e=>{$('highlightSwatch').style.background=e.target.value;focusExec('hiliteColor',e.target.value)};$('lineSpacing').onchange=e=>setLineHeight(e.target.value);$('clearFormatBtn').onclick=()=>{focusExec('removeFormat');focusExec('unlink')};$('upperBtn').onclick=()=>transformSelection(s=>s.toUpperCase());$('lowerBtn').onclick=()=>transformSelection(s=>s.toLowerCase());$('capitalizeBtn').onclick=()=>transformSelection(s=>s.replace(/\b\p{L}/gu,c=>c.toUpperCase()));$('linkBtn').onclick=()=>{const u=prompt('Enter URL:','https://');if(u)focusExec('createLink',u)};
$('imageBtn').onclick=()=>$('imagePicker').click();$('imagePicker').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>insertHtml(`<img src="${r.result}" alt="">`);r.readAsDataURL(f);e.target.value=''};$('tableBtn').onclick=()=>{const rows=Math.max(1,Math.min(20,+(prompt('Rows?','2')||0))),cols=Math.max(1,Math.min(10,+(prompt('Columns?','2')||0)));if(!rows||!cols)return;let h='<table><tbody>';for(let r=0;r<rows;r++){h+='<tr>';for(let c=0;c<cols;c++)h+='<td>&nbsp;</td>';h+='</tr>'}insertHtml(h+'</tbody></table><p></p>')};$('checkBtn').onclick=()=>insertHtml('<div>☐&nbsp;</div>');$('pageBreakBtn').onclick=()=>insertHtml('<div class="page-break"></div><p></p>');$('dateBtn').onclick=()=>insertHtml(new Date().toLocaleString());$('findBtn').onclick=()=>{const q=prompt('Find:');if(q)window.find(q,false,false,true)};function replaceText(root,f,r){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);let n=0;nodes.forEach(x=>{if(x.nodeValue.includes(f)){n+=x.nodeValue.split(f).length-1;x.nodeValue=x.nodeValue.split(f).join(r)}});return n}$('replaceBtn').onclick=()=>{const q=prompt('Find:');if(!q)return;const r=prompt('Replace with:','')??'';toast(`${replaceText(editor,q,r)} replaced`);scheduleSave()};
$('moreBtn').onclick=()=>$('moreTools').classList.toggle('open');['paperSize','orientation','marginPreset'].forEach(id=>$(id).onchange=applyPage);editor.addEventListener('input',scheduleSave);$('docTitle').addEventListener('input',scheduleSave);$('newBtn').onclick=()=>{if(!confirm('Start a new document?'))return;editor.innerHTML='';$('docTitle').value='Untitled';saveLocal();stats();editor.focus()};$('openBtn').onclick=()=>$('filePicker').click();$('filePicker').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{editor.innerHTML=f.name.toLowerCase().endsWith('.txt')?String(r.result).split('\n').map(x=>`<div>${x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))||'<br>'}</div>`).join(''):sanitizeHtml(String(r.result));$('docTitle').value=f.name.replace(/\.[^.]+$/,'')||'Untitled';saveLocal();stats();toast('Loaded')};r.readAsText(f);e.target.value=''};$('saveBtn').onclick=()=>{const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${$('docTitle').value.replace(/[&<>]/g,'')}</title></head><body>${editor.innerHTML}</body></html>`;download(html,'text/html;charset=utf-8',fileName('html'));toast('HTML saved')};$('printBtn').onclick=()=>window.print();window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('saveBtn').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('findBtn').click()}});
loadLocal();stats();applyPage();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v=3').catch(()=>{});
</script></body></html>
